<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GIP++</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #080808; }
        webview { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <script>
        // One window per account. The profile id comes from the URL; 'default' keeps the original login partition.
        const rawProfile = new URLSearchParams(location.search).get('profile') || 'default';
        const profileId = /^[a-z0-9]{4,16}$/.test(rawProfile) ? rawProfile : 'default';
        const webview = document.createElement('webview');
        webview.id = 'yapper-view';
        webview.setAttribute('partition', profileId === 'default' ? 'persist:yapper' : 'persist:yapper-' + profileId);
        // Fix: without "allowpopups" Electron makes window.open() / target="_blank" inside a <webview> return null BEFORE the app's
        // window-open handler (main.js) ever runs, so every link or file that Yappin opens in a new tab silently did nothing.
        // The handler in main.js denies every popup and sends web links to the real browser, so allowing them here opens no extra windows.
        webview.setAttribute('allowpopups', '');
        document.body.appendChild(webview);
        if (window.electronAPI && window.electronAPI.getPreloadPath) {
            const path = window.electronAPI.getPreloadPath();
            if (path) {
                const formattedPath = path.startsWith('/') ? path : '/' + path;
                // Fix: build a real file URL (spaces, %, # and ? in the install path used to break the preload, and without the
                // preload the page has no window.electronAPI: no downloads, no link hand-off, no themes).
                webview.setAttribute('preload', 'file://' + encodeURI(formattedPath).replace(/[?#]/g, (c) => encodeURIComponent(c)));
            }
        }
        webview.setAttribute('src', 'https://yapper.website');
        let retryCount = 0;
        webview.addEventListener('did-finish-load', async () => {
            retryCount = 0;
            try {
                const names = { gipSeal: 'GipSeal.png', gipSealWhite: 'GipSealWhite.png' };
                const assets = {};
                for (const key of Object.keys(names)) assets[key] = await window.electronAPI.getAsset(names[key]);
                await webview.executeJavaScript(`window.YapPlusAssets = ${JSON.stringify(assets)};`);
                let profile = { id: 'default', name: 'Main', color: '' };
                try { profile = await window.electronAPI.altsSelf() || profile; } catch (e) {}
                await webview.executeJavaScript(`window.__gipProfile = ${JSON.stringify(profile)};`);

                // Safe mode (hold Shift while the window opens): GIP++ loads, but no feature is started.
                let safe = false;
                try { safe = !!(await window.electronAPI.getSafeMode()); } catch (e) {}
                await webview.executeJavaScript(`window.__gipSafeMode = ${safe ? 'true' : 'false'};`);

                setTimeout(async () => {
                    // Each plugin runs on its own, so a syntax error in one no longer stops all the others.
                    let files = [];
                    try { files = await window.electronAPI.getPluginFiles(); } catch (e) {}
                    for (const p of files) {
                        if (!p.code || !p.code.trim()) continue;
                        try {
                            await webview.executeJavaScript(p.code);
                        } catch (err) {
                            console.error('[GIP++] plugin failed to load:', p.file, err);
                            try { window.electronAPI.logError('plugin file failed to load: ' + p.file + ': ' + (err && err.message || err)); } catch (e) {}
                        }
                    }
                    // Tell the app whether GIP++ came up. Two bad starts in a row after an update roll back to the bundled files.
                    try {
                        const ok = await webview.executeJavaScript('!!(window.YapPlus && window.YapPlus.PluginHost && window.YapPlus.VERSION)');
                        await window.electronAPI.bootResult(ok);
                    } catch (e) {}
                }, 1500);
            } catch (err) {
                console.error('[GIP++] startup failed', err);
            }
        });

        webview.addEventListener('did-fail-load', (event) => {
            // Defensive: -3 (ERR_ABORTED) means a navigation was cancelled or replaced by another one, not that the page failed to load.
            // A reload cannot fix that and would restart the page (and drop a voice call), so only real load failures are retried.
            if (event.errorCode === -3 || event.errorCode === 0) return;
            if (event.isMainFrame && retryCount < 3) {
                retryCount++;
                setTimeout(() => webview.reload(), 2000);
            }
        });
    </script>
</body>
</html>
